spring.application.name=Final_Project

# Load .env (project root) as a properties-style source. Square-bracket suffix
# tells Boot which loader to use since ".env" isn't a recognized extension.
# "optional:" means the app still starts (with unresolved placeholders failing
# loudly) if a teammate hasn't created their own .env yet.
spring.config.import=optional:file:.env[.properties]

# Supabase (Postgres) Configuration — credentials loaded from .env
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT signing secret — from .env, not committed. JwtService's hardcoded
# fallback only applies when this isn't set (e.g. the H2 test profile).
jwt.secret=${JWT_SECRET}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Configuration
file.upload-dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Mail Configuration (loaded from .env file)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:noreply@example.com}

# App Configuration
app.base-url=${APP_BASE_URL:http://localhost:5173}

# Supabase Storage — service role key stays server-side only, used solely
# to mint short-lived signed upload URLs for the admin media uploader.
# Empty defaults so the app still starts if unset; SupabaseStorageService
# throws a clear error at call time instead, rather than failing startup.
supabase.storage.url=${SUPABASE_URL:}
supabase.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:media}
